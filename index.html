  <style>
    :root {
      --orange: #ff8c00;
      --orange-dim: rgba(255,140,0,0.12);
      --bg: #080810;
      --bg2: #0d0d1a;
      --border: #1a1a2e;
      --text: #e8e6e0;
      --muted: #666;
      --green: #2ecc71;
      --yellow: #f39c12;
      --red: #e74c3c;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* \u2500\u2500 NAV \u2500\u2500 */
    nav {
      position: fixed; top: 0; left: 0; right: 0;
      background: rgba(8,8,16,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      height: 60px;
      display: flex; align-items: center; justify-content: space-between;
      z-index: 100;
    }
    .nav-logo {
      font-family: 'DM Mono', monospace;
      font-size: 1rem; font-weight: 500;
      color: var(--orange);
      text-decoration: none;
      letter-spacing: 0.05em;
    }
    .nav-links { display: flex; gap: 0.5rem; align-items: center; }
    .nav-links a {
      color: var(--muted); text-decoration: none;
      font-size: 0.82rem; padding: 6px 12px;
      border-radius: 3px; transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--text); }
    .nav-cta {
      background: var(--orange) !important;
      color: #000 !important;
      font-weight: 600 !important;
      letter-spacing: 0.04em;
    }
    .nav-cta:hover { background: #ffaa33 !important; }

    /* \u2500\u2500 HERO \u2500\u2500 */
    .hero {
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center;
      padding: 100px 2rem 4rem;
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(255,140,0,0.08) 0%, transparent 70%);
      pointer-events: none;
    }
    .hero-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--orange-dim);
      border: 1px solid rgba(255,140,0,0.25);
      color: var(--orange);
      padding: 5px 14px; border-radius: 100px;
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem; letter-spacing: 0.1em;
      margin-bottom: 2rem;
      animation: fadeUp 0.6s ease both;
    }
    .pulse {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--orange);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.7); }
    }
    h1 {
      font-size: clamp(2.2rem, 6vw, 4rem);
      font-weight: 700; line-height: 1.15;
      letter-spacing: -0.02em;
      max-width: 800px;
      animation: fadeUp 0.6s 0.1s ease both;
    }
    h1 span { color: var(--orange); }
    .hero-sub {
      font-size: clamp(1rem, 2vw, 1.2rem);
      color: var(--muted); max-width: 540px;
      margin: 1.5rem auto 2.5rem;
      animation: fadeUp 0.6s 0.2s ease both;
    }
    .hero-ctas {
      display: flex; gap: 1rem; flex-wrap: wrap;
      justify-content: center;
      animation: fadeUp 0.6s 0.3s ease both;
    }
    .btn-primary {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--orange); color: #000;
      padding: 14px 28px; border-radius: 4px;
      text-decoration: none; font-weight: 700;
      font-size: 0.95rem; letter-spacing: 0.02em;
      transition: background 0.2s, transform 0.15s;
    }
    .btn-primary:hover { background: #ffaa33; transform: translateY(-1px); }
    .btn-secondary {
      display: inline-flex; align-items: center; gap: 8px;
      background: transparent; color: var(--text);
      border: 1px solid var(--border);
      padding: 14px 28px; border-radius: 4px;
      text-decoration: none; font-weight: 500;
      font-size: 0.95rem;
      transition: border-color 0.2s, transform 0.15s;
    }
    .btn-secondary:hover { border-color: #444; transform: translateY(-1px); }

    /* \u2500\u2500 STATS \u2500\u2500 */
    .stats {
      display: flex; gap: 0; flex-wrap: wrap;
      justify-content: center;
      margin-top: 4rem; width: 100%; max-width: 700px;
      border: 1px solid var(--border); border-radius: 8px;
      overflow: hidden;
      animation: fadeUp 0.6s 0.4s ease both;
    }
    .stat {
      flex: 1; min-width: 140px;
      padding: 1.5rem 1rem; text-align: center;
      border-right: 1px solid var(--border);
      background: var(--bg2);
    }
    .stat:last-child { border-right: none; }
    .stat-num {
      font-family: 'DM Mono', monospace;
      font-size: 1.8rem; font-weight: 500;
      color: var(--orange);
    }
    .stat-label {
      font-size: 0.72rem; color: var(--muted);
      letter-spacing: 0.06em; margin-top: 4px;
      text-transform: uppercase;
    }

    /* \u2500\u2500 SECTION \u2500\u2500 */
    section { padding: 5rem 2rem; max-width: 1100px; margin: 0 auto; }
    .section-tag {
      font-family: 'DM Mono', monospace;
      font-size: 0.68rem; color: var(--orange);
      letter-spacing: 0.14em; text-transform: uppercase;
      margin-bottom: 1rem;
    }
    h2 {
      font-size: clamp(1.6rem, 3vw, 2.2rem);
      font-weight: 700; letter-spacing: -0.01em;
      line-height: 1.2; margin-bottom: 1rem;
    }
    .section-sub { color: var(--muted); font-size: 1rem; max-width: 520px; }

    /* \u2500\u2500 CITT\u00c0 CARDS \u2500\u2500 */
    .city-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem; margin-top: 3rem;
    }
    .city-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px; padding: 1.5rem;
      text-decoration: none; color: var(--text);
      transition: border-color 0.2s, transform 0.15s;
      display: block;
    }
    .city-card:hover {
      border-color: rgba(255,140,0,0.4);
      transform: translateY(-2px);
    }
    .city-emoji { font-size: 2rem; margin-bottom: 0.75rem; }
    .city-name { font-size: 1.2rem; font-weight: 600; margin-bottom: 4px; }
    .city-meta { font-size: 0.78rem; color: var(--muted); }
    .city-pills { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 1rem; }
    .pill {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem; padding: 3px 10px;
      border-radius: 100px; letter-spacing: 0.06em;
    }
    .pill-green { background: rgba(46,204,113,0.1); color: var(--green); border: 1px solid rgba(46,204,113,0.2); }
    .pill-orange { background: var(--orange-dim); color: var(--orange); border: 1px solid rgba(255,140,0,0.2); }

    /* \u2500\u2500 COME FUNZIONA \u2500\u2500 */
    .steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 2rem; margin-top: 3rem; }
    .step { padding: 1.5rem; background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; }
    .step-num {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem; color: var(--orange);
      letter-spacing: 0.1em; margin-bottom: 0.75rem;
    }
    .step h3 { font-size: 1rem; font-weight: 600; margin-bottom: 0.5rem; }
    .step p { font-size: 0.82rem; color: var(--muted); line-height: 1.6; }

    /* \u2500\u2500 MEDIA SECTION \u2500\u2500 */
    .media-section {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 3rem 2rem;
      margin: 0 auto; max-width: 1100px;
    }
    .media-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; align-items: start; }
    .media-facts { display: flex; flex-direction: column; gap: 1rem; margin-top: 2rem; }
    .media-fact {
      display: flex; align-items: flex-start; gap: 1rem;
      padding: 1rem; background: var(--bg);
      border: 1px solid var(--border); border-radius: 6px;
    }
    .fact-icon { font-size: 1.2rem; flex-shrink: 0; margin-top: 2px; }
    .fact-text { font-size: 0.82rem; color: var(--muted); line-height: 1.5; }
    .fact-text strong { color: var(--text); }
    .media-contact {
      margin-top: 2rem; padding: 1.5rem;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 6px;
    }
    .media-contact p { font-size: 0.82rem; color: var(--muted); margin-bottom: 1rem; }
    .media-contact a {
      color: var(--orange); text-decoration: none;
      font-family: 'DM Mono', monospace; font-size: 0.85rem;
    }

    /* \u2500\u2500 TELEGRAM CTA \u2500\u2500 */
    .telegram-band {
      background: linear-gradient(135deg, #1a2a3a 0%, #0d1a24 100%);
      border: 1px solid #1e3a50;
      border-radius: 8px;
      padding: 2.5rem 2rem;
      text-align: center;
      margin: 0 2rem;
      max-width: 1100px;
      margin: 0 auto;
    }
    .telegram-band h3 { font-size: 1.4rem; margin-bottom: 0.5rem; }
    .telegram-band p { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
    .btn-telegram {
      display: inline-flex; align-items: center; gap: 8px;
      background: #229ED9; color: #fff;
      padding: 12px 24px; border-radius: 4px;
      text-decoration: none; font-weight: 600; font-size: 0.9rem;
      transition: background 0.2s;
    }
    .btn-telegram:hover { background: #1a8abf; }

    /* \u2500\u2500 FOOTER \u2500\u2500 */
    footer {
      border-top: 1px solid var(--border);
      padding: 2rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.78rem;
    }
    footer a { color: #444; text-decoration: none; }
    footer a:hover { color: var(--text); }
    .footer-links { display: flex; gap: 1.5rem; justify-content: center; flex-wrap: wrap; margin-bottom: 1rem; }

    /* \u2500\u2500 ANIMATIONS \u2500\u2500 */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* \u2500\u2500 MOBILE \u2500\u2500 */
    @media (max-width: 768px) {
      .nav-links a:not(.nav-cta) { display: none; }
      .media-grid { grid-template-columns: 1fr; gap: 2rem; }
      .stats { border-radius: 6px; }
      .stat { min-width: 120px; padding: 1.2rem 0.75rem; }
      .stat-num { font-size: 1.4rem; }
    }
  </style>
</head>
